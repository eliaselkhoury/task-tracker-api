name: CI

# Push covers work pushed straight to a branch; pull_request covers the merge
# commit a PR would actually produce, which is not the same tree. Both, so a
# branch cannot be green on its own and red once merged.
on:
  push:
  pull_request:

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Pinned to 3.12 - the version the project is developed against and the
      # one in the Dockerfile. "3.x" would let a future release change the
      # runtime under the suite without a commit explaining why.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # Real install of the pinned dependencies. If this fails the job fails;
      # there is no fallback that would let the suite run against whatever
      # happened to be on the image.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No continue-on-error, no `|| true`, no `if:` guard. A failing test is a
      # failing build - that is the only reason this workflow exists.
      - name: Run the test suite
        run: pytest -v
